<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2ff;
    margin: 0;
    padding: 30px 15px;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #00000015;
}

h1 {
    text-align: center;
    color: #1e3a8a;
}

.subtitle {
    text-align: center;
    color: #666;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

input {
    flex: 1;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
    min-width: 0;
}

button {
    border: none;
    padding: 12px 18px;
    background: #1e40af;
    color: white;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

ul {
    list-style: none;
    padding: 0;
    margin-top: 25px;
}

li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f1f5f9;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 7px;
}

li span {
    flex: 1;
    overflow-wrap: anywhere;
}

li.completed span {
    text-decoration: line-through;
    color: gray;
}

li input[type="checkbox"] {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
}

.delete {
    background: #dc2626;
}

.delete:hover {
    background: #b91c1c;
}

#message {
    text-align: center;
    color: #64748b;
    margin-top: 20px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #1e40af;
    text-decoration: none;
}

@media(max-width: 450px) {
    .container {
        padding: 20px;
    }

    .input-area {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>
    <p class="subtitle">Organize your daily tasks easily!</p>

    <div class="input-area">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
        >

        <button onclick="addTask()">Add Task</button>
    </div>

    <ul id="taskList"></ul>

    <p id="message"></p>

    <a href="index.html" class="back">
        Back to Portfolio
    </a>

</div>

<script>

let tasks = [];

function loadTasks() {
    try {
        tasks = JSON.parse(
            localStorage.getItem("myTasks")
        ) || [];
    } catch (error) {
        tasks = [];
    }

    if (!Array.isArray(tasks)) {
        tasks = [];
    }

    displayTasks();
}

function saveTasks() {
    localStorage.setItem(
        "myTasks",
        JSON.stringify(tasks)
    );
}

function addTask() {

    const input = document.getElementById("taskInput");
    const taskText = input.value.trim();

    if (taskText === "") {
        alert("Please enter a task!");
        return;
    }

    tasks.push({
        text: taskText,
        completed: false
    });

    saveTasks();

    input.value = "";

    displayTasks();
}

function displayTasks() {

    const list = document.getElementById("taskList");
    const message = document.getElementById("message");

    list.innerHTML = "";

    if (tasks.length === 0) {
        message.textContent = "No tasks yet. Add your first task!";
    } else {
        message.textContent = tasks.length + " task(s)";
    }

    tasks.forEach((task, index) => {

        const li = document.createElement("li");

        if (task.completed) {
            li.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;

        checkbox.addEventListener("change", function() {
            tasks[index].completed = checkbox.checked;
            saveTasks();
            displayTasks();
        });

        const span = document.createElement("span");
        span.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";

        deleteButton.addEventListener("click", function() {
            tasks.splice(index, 1);
            saveTasks();
            displayTasks();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteButton);

        list.appendChild(li);
    });
}

document.getElementById("taskInput")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            addTask();
        }
    });

loadTasks();

</script>

</body>
  </html>
