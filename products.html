<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Listing Page</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    header {
      background: #243b55;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 25px;
    }

    select {
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .price {
      color: #087443;
      font-weight: bold;
      margin: 10px 0;
    }

    .card p {
      color: #555;
      font-size: 14px;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 20px auto;
      padding: 12px 20px;
      background: #243b55;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Product Listing Page</h1>
    <p>Explore Our Products</p>
  </header>

  <div class="controls">
    <select id="category" onchange="filterProducts()">
      <option value="all">All Categories</option>
      <option value="electronics">Electronics</option>
      <option value="fashion">Fashion</option>
      <option value="accessories">Accessories</option>
    </select>

    <select id="sort" onchange="filterProducts()">
      <option value="default">Sort by Price</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
    </select>
  </div>

  <div class="products" id="productList"></div>

  <a class="back" href="index.html">Back to Portfolio</a>

  <script>
    const products = [
      {
        name: "Headphones",
        category: "electronics",
        price: 999,
        image: "https://placehold.co/300x200?text=Headphones"
      },
      {
        name: "Smart Watch",
        category: "electronics",
        price: 1499,
        image: "https://placehold.co/300x200?text=Smart+Watch"
      },
      {
        name: "T-Shirt",
        category: "fashion",
        price: 499,
        image: "https://placehold.co/300x200?text=T-Shirt"
      },
      {
        name: "Shoes",
        category: "fashion",
        price: 1299,
        image: "https://placehold.co/300x200?text=Shoes"
      },
      {
        name: "Handbag",
        category: "accessories",
        price: 899,
        image: "https://placehold.co/300x200?text=Handbag"
      },
      {
        name: "Sunglasses",
        category: "accessories",
        price: 599,
        image: "https://placehold.co/300x200?text=Sunglasses"
      }
    ];

    function filterProducts() {
      const category = document.getElementById("category").value;
      const sort = document.getElementById("sort").value;

      let filtered = products.filter(product =>
        category === "all" || product.category === category
      );

      if (sort === "low") {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sort === "high") {
        filtered.sort((a, b) => b.price - a.price);
      }

      const productList = document.getElementById("productList");

      productList.innerHTML = filtered.map(product => `
        <div class="card">
          <img src="${product.image}" alt="${product.name}">
          <h3>${product.name}</h3>
          <p>Category: ${product.category}</p>
          <div class="price">₹${product.price}</div>
        </div>
      `).join("");
    }

    filterProducts();
  </script>

</body>
</html>
